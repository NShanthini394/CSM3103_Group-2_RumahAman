<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RumahAman</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fa-solid fa-shield-halved"></i>
                <span>RumahAman</span>
            </div>
            <h2>Welcome Back</h2>
            <p>Access your smart crime insights dashboard</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn-login">
                <span>Login</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="register-redirect">
            <p>Don't have an account? <a href="register.html" class="btn-register-link">Register Now</a></p>
            <p style="margin-top: 12px; font-size: 0.8rem;"><a href="login_landlord.html"
                    style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-right"></i>Login As Landlord</a></p>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // --- LOGIK LOG MASUK USER ---
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInputVal = passwordInput.value;

            // Ambil data users daripada localStorage
            let users = JSON.parse(localStorage.getItem('users')) || [];

            const validUser = users.find(user =>
                (user.username === usernameInput || user.email === usernameInput) &&
                user.password === passwordInputVal
            );

            if (validUser) {
                if (validUser.role === 'user') {
                    localStorage.setItem('currentUser', JSON.stringify(validUser));

                    alert('Login successful! Redirecting to Dashboard...');
                    window.location.href = '../User_Dashboard/user.html';
                } else {
                    alert('Access Denied. This account is registered as a Landlord. Please use the Landlord Portal.');
                }
            } else {
                alert('Invalid username or password. Please try again.');
            }
        }
    </script>
</body>

</html>
