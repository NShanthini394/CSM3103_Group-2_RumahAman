<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RumahAman</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fa-solid fa-shield-halved"></i>
                <span>RumahAman</span>
            </div>
            <h2>Create Account</h2>
            <p>Join us to explore neighborhood safety scores</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            
            <div class="input-group">
                <label for="regUsername">Username</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="regUsername" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="regEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="regPassword">Password</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-lock input-icon"></i>
                    <input type="password" id="regPassword" placeholder="Create a strong password" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-lock-keyhole input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
                    <i class="fa-regular fa-eye toggle-password" id="toggleConfirmPassword"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="termsAgree" required>
                    <span>I agree to the <a href="#" class="forgot-pass">Terms & Privacy Policy</a></span>
                </label>
            </div>

            <div id="errorMessage" class="error-banner" style="display: none;"></div>

            <button type="submit" class="btn-login">
                <span>Register</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <div class="register-redirect">
            <p>Already have an account? <a href="login.html" class="btn-register-link">Login Here</a></p>
        </div>
    </div>

    <script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#regPassword');
    
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    const toggleConfirmPassword = document.querySelector('#toggleConfirmPassword');
    const confirmPasswordInput = document.querySelector('#confirmPassword');
    
    toggleConfirmPassword.addEventListener('click', function () {
        const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // --- LOGIK PENDAFTARAN USER ---
    function handleRegister(event) {
        event.preventDefault();
        
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const errorBanner = document.getElementById('errorMessage');

        errorBanner.style.display = "none";

        if (password !== confirmPassword) {
            errorBanner.textContent = "Passwords do not match. Please check again.";
            errorBanner.style.display = "block";
            return;
        }

        // Ambil senarai user sedia ada daripada localStorage (atau cipta array baru jika kosong)
        let users = JSON.parse(localStorage.getItem('users')) || [];

        const userExists = users.some(user => user.username === username || user.email === email);
        if (userExists) {
            errorBanner.textContent = "Username or Email already registered!";
            errorBanner.style.display = "block";
            return;
        }

        // Simpan data user baru berserta jenis peranan (role)
        const newUser = {
            username: username,
            email: email,
            password: password,
            role: 'user'
        };

        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users)); // Simpan semula ke localStorage

        alert('Registration completed successfully! Redirecting to login page...');
        window.location.href = 'login.html';
    }
    </script>
</body>
</html>
